<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2c1741">
    <meta name="description" content="Kit digital com 40 atividades de Natal para imprimir — colorir, recortar e brincar com crianças de 3 a 8 anos. Acesso imediato ao PDF. Criaê.">
    <title>Natal Mágico — Kit de Atividades de Natal para Imprimir | Criaê</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/ui/favicon.png">

    <!-- Preconnect & DNS-Prefetch para aceleração de conexões críticas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://connect.facebook.net">
    <link rel="dns-prefetch" href="https://www.facebook.com">
    <link rel="preconnect" href="https://connect.facebook.net" crossorigin>

    <!-- Google Fonts assíncrono (elimina bloqueio de renderização do FCP) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800;900&display=swap">
    </noscript>

    <!-- Meta Pixel com eventID compartilhado para Deduplicação com a Conversions API -->
    <script>
      (function (window, document) {
        if (window.fbq) return;

        const fbq = window.fbq = function () {
          if (fbq.callMethod) {
            fbq.callMethod.apply(fbq, arguments);
          } else {
            fbq.queue.push(arguments);
          }
        };
        if (!window._fbq) window._fbq = fbq;
        fbq.push = fbq;
        fbq.loaded = true;
        fbq.version = '2.0';
        fbq.queue = [];

        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(script);

        const pageViewId = 'pv_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
        window._initialPageViewId = pageViewId;

        fbq('init', '2278057266394112');
        fbq('track', 'PageView', {}, { eventID: pageViewId });
      })(window, document);
    </script>
  </head>
  <body>
    <noscript><img src="https://www.facebook.com/tr?id=2278057266394112&amp;ev=PageView&amp;noscript=1" width="1" height="1" alt="" style="display:none"></noscript>
    <div id="root"></div>
    <noscript>Ative o JavaScript para ver a página e folhear a prévia. <a href="https://pay.kiwify.com.br/K1eUYmk">Conheça a oferta do Natal Mágico</a>.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
