    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">

    <!-- Meta Pixel com fila em memória imediata e carregamento do script fbevents.js atrasado (interação/ociosidade) -->
    <script>
      (function (window, document) {
        if (window.fbq) return;

        const fbq = window.fbq = function () {
          if (fbq.callMethod) {
            fbq.callMethod.apply(fbq, arguments);
          } else {
            fbq.queue.push(arguments);
          }
        };
        if (!window._fbq) window._fbq = fbq;
        fbq.push = fbq;
        fbq.loaded = true;
        fbq.version = '2.0';
        fbq.queue = [];

        // Fila imediata do PageView com eventID estável para deduplicação com a CAPI
        const pageViewId = 'pv_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
        window._initialPageViewId = pageViewId;

        fbq('init', '2278057266394112');
        fbq('track', 'PageView', {}, { eventID: pageViewId });

        // Carrega o fbevents.js sob demanda após primeira interação ou quando o navegador estiver ocioso
        let pixelLoaded = false;
        function loadPixelScript() {
          if (pixelLoaded) return;
          pixelLoaded = true;
          ['scroll', 'touchstart', 'pointerdown', 'mousemove'].forEach(function (e) {
            window.removeEventListener(e, loadPixelScript, { passive: true });
          });
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://connect.facebook.net/en_US/fbevents.js';
          document.head.appendChild(script);
        }

        ['scroll', 'touchstart', 'pointerdown', 'mousemove'].forEach(function (e) {
          window.addEventListener(e, loadPixelScript, { passive: true, once: true });
        });

        if ('requestIdleCallback' in window) {
          requestIdleCallback(function () { setTimeout(loadPixelScript, 2500); });
        } else {
          window.addEventListener('load', function () { setTimeout(loadPixelScript, 2500); });
        }
      })(window, document);
    </script>
  </head>
